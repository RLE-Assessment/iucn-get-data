[project]
name = "iucn-get-data"
version = "0.0.9"
description = "Tools for working with IUCN Global Ecosystem Typology data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.1.0",
    "pandas>=3.0.0",
    "pyyaml>=6.0",
    "rdflib>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
# Remote vocabulary loading. fsspec needs a scheme-specific backend, so each
# scheme is its own extra (install only what you use):
remote = ["fsspec>=2023.0.0", "aiohttp>=3.9"]      # http:// and https://
gs = ["fsspec>=2023.0.0", "gcsfs>=2024.0.0"]       # gs://
s3 = ["fsspec>=2023.0.0", "s3fs>=2024.0.0"]        # s3://

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["iucn_get_data"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
iucn_get_data = ["py.typed", "data/*.yaml", "data/vocabulary/*.jsonld", "data/vocabulary/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
